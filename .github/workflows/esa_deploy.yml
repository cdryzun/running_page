name: Deploy to ESA Pages

# Deploys the built SPA to Alibaba Cloud ESA (Edge Security Acceleration)
# Pages.
#
# Triggers:
#   1. push to master (frontend source or config changes)
#   2. workflow_run: fires when "Run Data Sync" completes. This is needed
#      because the sync workflow pushes via GITHUB_TOKEN, whose events do
#      NOT cascade to other workflows (anti-recursion). workflow_run bridges
#      that gap.
#   3. workflow_dispatch (manual)
#
# The "should-deploy" gate skips redundant deploys when sync produced no
# new data (no "update new runs" commit).
on:
  push:
    branches:
      - master
    paths:
      # Only run when frontend source or synced data changes.
      - 'src/**'
      - 'assets/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'esa.jsonc'
      - 'tests/**'
      - '.github/workflows/esa_deploy.yml'
  workflow_run:
    workflows: ['Run Data Sync']
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Queue (do not cancel) deploys so an in-flight build+deploy is never
# aborted mid-way by a newer trigger. For deploy pipelines, cancelling
# can starve the queue under burst triggers.
concurrency:
  group: esa-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pre-deploy verification
    runs-on: ubuntu-latest
    # Inline the workflow_run conclusion gate — avoids a separate gate job
    # (saves a runner cold-start per deploy). For push/dispatch, always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin to the trigger commit so test and deploy build the exact
          # same code — avoids shipping a commit that test never validated
          # when master advances between jobs.
          ref: ${{ github.sha }}
          fetch-depth: 0

      # --- Python data + config tests ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Python test suite (unittest discover)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      # --- Frontend lint + build ---
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (prettier)
        run: pnpm run check

      - name: Lint (eslint, no --fix)
        run: npx eslint src --ext .ts,.tsx

      - name: Run frontend unit tests
        run: pnpm run test:unit

      - name: Build SPA (root domain, no PATH_PREFIX)
        run: pnpm build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          echo "dist contents:"; ls -la dist/

  deploy:
    name: Deploy to ESA edge
    runs-on: ubuntu-latest
    needs: test
    # Only deploy if test passed. Re-check workflow_run conclusion defensively
    # in case test was manually re-run after a failed sync.
    if: ${{ needs.test.result == 'success' }}
    # Credentials at job level so every step has them without re-declaration.
    # Values live only in GitHub Encrypted Secrets, never in the repo.
    env:
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pin to the same commit the test job validated.
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm build

      - name: Verify build output
        run: test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }

      - name: Install ESA CLI
        # Pin to a verified version — @latest risks silent breakage if a
        # future release changes flag semantics (e.g. --assets/--environment).
        # Bump explicitly after testing a new version locally.
        run: npm install -g esa-cli@1.0.11

      # GitHub-hosted runners (US) occasionally fail to reach Alibaba Cloud's
      # ESA API on the first attempt. Retry login a few times since esa-cli
      # has no built-in retry.
      - name: Login to ESA (with retry)
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            echo "::group::Login attempt $attempt"
            if esa-cli login; then
              echo "Login succeeded on attempt $attempt"
              exit 0
            fi
            echo "Login attempt $attempt failed, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "::error::ESA login failed after 5 attempts"
          exit 1

      - name: Deploy to ESA Pages (with retry)
        env:
          # ESA API rejects descriptions longer than ~32 chars, so use the
          # short SHA (7 chars) instead of the full 40-char github.sha.
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # esa-cli deploy uploads the full dist/ to ESA's API — same network
          # path that login retries for. Retry on transient failures so a
          # single network hiccup does not break the deploy chain.
          for attempt in 1 2 3 4 5; do
            echo "::group::Deploy attempt $attempt"
            if esa-cli deploy \
                --name running-page \
                --assets ./dist \
                --environment production \
                --description "CI build ${SHORT_SHA:0:7}"; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "Deploy attempt $attempt failed, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "::error::ESA deploy failed after 5 attempts"
          exit 1
